name: Generate and deploy catalogue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewsync-state
  cancel-in-progress: false

jobs:
  state-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check out durable state
        id: state_checkout
        uses: actions/checkout@v4
        with:
          ref: viewsync-state
          path: state
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate restored state
        id: validate_state
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: python -m src.state_sync validate --state-dir state

      - name: Run tests
        run: python -m pytest

      - name: Capture existing snapshot identities
        id: snapshot_baseline
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: python -m src.state_sync capture --state-dir state --baseline /tmp/viewsync-state-baseline.json

      - name: Generate catalogue
        id: generate_catalogue
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: python -m src.main --config catalog-config --output dist --state state

      - name: Persist append-only state
        if: ${{ always() && steps.state_checkout.outcome == 'success' && steps.validate_state.outcome == 'success' && steps.snapshot_baseline.outcome == 'success' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python -m src.state_sync verify --state-dir state --baseline /tmp/viewsync-state-baseline.json
          git -C state config user.name "github-actions[bot]"
          git -C state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C state add --all
          python -m src.state_sync verify-staged --state-dir state
          if git -C state diff --cached --quiet; then
            echo "No durable state changes to commit."
          else
            git -C state commit -m "Persist Viewsync state for run ${GITHUB_RUN_ID}"
            git -C state push origin HEAD:refs/heads/viewsync-state
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: state-sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
