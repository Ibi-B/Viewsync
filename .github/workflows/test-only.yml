name: Test full suite twice

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-only.yml"
      - ".github/workflows/generate-catalogue.yml"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite-twice:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run complete test suite twice against the same commit
        env:
          TMDB_API_KEY: ""
          TMDB_ACCESS_TOKEN: ""
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "First full-suite run on $actual"
          python -m pytest
          test "$(git rev-parse HEAD)" = "$expected"
          echo "Second full-suite run on $actual"
          python -m pytest
          test "$(git rev-parse HEAD)" = "$expected"
